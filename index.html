<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- လက်ဆောင်သေတ္တာပုံ -->
        <div class="gift-box" onclick="openBox()">
            🎁
        </div>
        <h1 id="message">မ အတွက် လက်ဆောင်လေးကို နှိပ်ကြည့်ပါ</h1>
        
        <!-- ပေါ်လာမယ့် မက်ဆေ့ချ်နဲ့ ခလုတ်များ -->
        <div id="hidden-content" class="hidden">
            <p>မောင်ပေးတဲ့ လက်ဆောင်လေး ကြိုက်လားဟင်... 🥰</p>
            <button onclick="sayYes()">ကြိုက်တယ် ❤️</button>
            <button id="no-btn" onmouseover="moveButton()">မကြိုက်ဘူး 😜</button>
        </div>
    </div>

    <script>
        function openBox() {
            document.getElementById('message').innerText = "To My Special One ✨";
            document.getElementById('hidden-content').classList.remove('hidden');
        }

        function sayYes() {
            alert("ယေးးး! မောင် ပျော်သွားပြီ 😘💖");
        }

        function moveButton() {
            const x = Math.random() * 200 - 100;
            const y = Math.random() * 200 - 100;
            document.getElementById('no-btn').style.transform = `translate(${x}px, ${y}px)`;
        }
    </script>
</body>
</html>
